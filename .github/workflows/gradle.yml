name: Build mod jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Build
        run: |
          FILE=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No settings.gradle found. Upload the unzipped project files, not the .zip."
            ls -R
            exit 1
          fi
          cd "$(dirname "$FILE")"
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: koenigsegg-cars-jar
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
